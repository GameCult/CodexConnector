[package]
name = "codex-connector"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "LICENSE"
description = "Credential-isolated typed transport for Codex-compatible subscription inference"
repository = "https://github.com/GameCult/CodexConnector"

[lib]
path = "src/lib.rs"

[[bin]]
name = "codex-connector"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.23"
cultcache-rs = { git = "https://github.com/GameCult/cultcache-rs.git", rev = "fdbf3bf0a4b3f6b617c224d7439feb8e69d4474c" }
rand_core = { version = "0.6", features = ["getrandom"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zeroize = "1"
