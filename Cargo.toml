[package]
name = "codex-connector"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "LICENSE"
description = "Credential-isolated typed transport for Codex-compatible subscription inference"
repository = "https://github.com/GameCult/CodexConnector"

[lib]
path = "src/lib.rs"

[[bin]]
name = "codex-connector"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = []
daemon = [
  "dep:anyhow",
  "dep:chrono",
  "dep:cultcache-rs",
  "dep:cultnet-rs",
  "dep:fs2",
  "dep:libc",
  "dep:ureq",
]

[dependencies]
aes-gcm = "0.10"
anyhow = { version = "1", optional = true }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"], optional = true }
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "e171eca32329baa928f4a1d810401a8b4c857029", package = "cultcache-rs", optional = true }
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "e171eca32329baa928f4a1d810401a8b4c857029", package = "cultnet-rs", optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
zeroize = "1"
