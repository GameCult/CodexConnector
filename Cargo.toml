[package]
name = "codex-connector"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "LICENSE"
description = "Credential-isolated typed transport for Codex-compatible subscription inference"
repository = "https://github.com/GameCult/CodexConnector"

[lib]
path = "src/lib.rs"

[[bin]]
name = "codex-connector"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = ["client"]
client = [
  "dep:aes-gcm",
  "dep:rand_core",
  "dep:zeroize",
]
daemon = [
  "client",
  "dep:anyhow",
  "dep:chrono",
  "dep:cultcache-rs",
  "dep:cultnet-rs",
  "dep:ed25519-dalek",
  "dep:serde_bytes",
  "dep:ureq",
  "dep:uuid",
]

[dependencies]
aes-gcm = { version = "0.10", optional = true }
anyhow = { version = "1", optional = true }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"], optional = true }
cultcache-rs = { git = "https://github.com/GameCult/cultcache-rs.git", rev = "fdbf3bf0a4b3f6b617c224d7439feb8e69d4474c", optional = true }
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "75c180782aeba7cfd22d6412877397708a4ed28f", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = { version = "0.11", optional = true }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
zeroize = { version = "1", optional = true }
